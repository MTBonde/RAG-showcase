    .bg { fill: #0d1117; }
    .series-0 { fill: #4f9bd1; }
    .series-1 { fill: #4fbdb8; }
    .track { fill: #1c232c; }
    .label, .label-strong, .count, .title, .legend { fill: #e6edf3; }
    .note { fill: #9198a1; }
  }
</style>
