<svg xmlns="http://www.w3.org/2000/svg" width="800" height="382" viewBox="0 0 800 382" role="img" aria-label="The right note inserted, step by step">
<style>
  .bg { fill: #ffffff; }
  .series-0 { fill: #2f6f9f; }
  .series-1 { fill: #2a8a86; }
  .track { fill: #eef1f4; }
  .label { fill: #1f2328; font: 14px Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; }
  .label-strong { fill: #1f2328; font: 600 14px Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; }
  .count { fill: #1f2328; font: 12px 'JetBrains Mono', ui-monospace, monospace; }
  .title { fill: #1f2328; font: 600 16px Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; }
  .legend { fill: #1f2328; font: 13px Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; }
  .note { fill: #59636e; font: 12px Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; }
    .series-0 { fill: #4f9bd1; }
    .series-1 { fill: #4fbdb8; }
    .track { fill: #1c232c; }
    .label, .label-strong, .count, .title, .legend { fill: #e6edf3; }
    .note { fill: #9198a1; }
  }
</style>
<rect class="bg" width="800" height="382" rx="8"/>
<text class="title" x="20" y="34">The right note inserted, step by step</text>
<rect class="series-0" x="20" y="52" width="14" height="14" rx="3"/>
<text class="legend" x="40" y="64">Tuning set (24 questions)</text>
<rect class="series-1" x="250" y="52" width="14" height="14" rx="3"/>
<text class="legend" x="270" y="64">Check set (12 questions)</text>
<text class="label" x="20" y="112">Starting point</text>
<rect class="track" x="290" y="92" width="300" height="14" rx="3"/>
<rect class="series-0" x="290" y="92" width="125" height="14" rx="3"/>
<text class="count" x="600" y="104">10 of 24, false 0 of 30</text>
<rect class="track" x="290" y="110" width="300" height="14" rx="3"/>
<rect class="series-1" x="290" y="110" width="125" height="14" rx="3"/>
<text class="count" x="600" y="122">5 of 12, false 2 of 8</text>
<text class="label" x="20" y="164">With translation</text>
<rect class="track" x="290" y="144" width="300" height="14" rx="3"/>
<rect class="series-0" x="290" y="144" width="150" height="14" rx="3"/>
<text class="count" x="600" y="156">12 of 24, false 1 of 30</text>
<rect class="track" x="290" y="162" width="300" height="14" rx="3"/>
<rect class="series-1" x="290" y="162" width="200" height="14" rx="3"/>
<text class="count" x="600" y="174">8 of 12, false 1 of 8</text>
<text class="label" x="20" y="216">Translation and reranker</text>
<rect class="track" x="290" y="196" width="300" height="14" rx="3"/>
<rect class="series-0" x="290" y="196" width="200" height="14" rx="3"/>
<text class="count" x="600" y="208">16 of 24, false 0 of 30</text>
<rect class="track" x="290" y="214" width="300" height="14" rx="3"/>
<rect class="series-1" x="290" y="214" width="200" height="14" rx="3"/>
<text class="count" x="600" y="226">8 of 12, false 1 of 8</text>
<text class="label-strong" x="20" y="268">Current iteration, reranker off</text>
<rect class="track" x="290" y="248" width="300" height="14" rx="3"/>
<rect class="series-0" x="290" y="248" width="138" height="14" rx="3"/>
<text class="count" x="600" y="260">11 of 24, false 0 of 30</text>
<rect class="track" x="290" y="266" width="300" height="14" rx="3"/>
<rect class="series-1" x="290" y="266" width="200" height="14" rx="3"/>
<text class="count" x="600" y="278">8 of 12, false 1 of 8</text>
<text class="note" x="20" y="308">False = something inserted into an ordinary prompt where nothing belonged.</text>
<text class="note" x="20" y="330">The reranker is switched off for its memory cost; its gain was on the tuning set only.</text>
<text class="note" x="20" y="352">The review fixes to the insert rule took the tuning set from 12 to 11 right and from 1 to 0 false.</text>
</svg>
